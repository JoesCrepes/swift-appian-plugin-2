# swiftmxtojson function
function.swiftmxtojson.description=Converts a SWIFT MX (ISO 20022 XML) message to JSON format with structured field labels.
function.swiftmxtojson.param.mxMessage.description=The raw SWIFT MX message string (XML format) to convert

# swiftmxtojsonbytype function
function.swiftmxtojsonbytype.description=Converts a specific SWIFT MX message type to JSON format with type validation. Ensures the message matches the expected identifier before conversion.
function.swiftmxtojsonbytype.param.mxMessage.description=The raw SWIFT MX message string (XML format) to convert
function.swiftmxtojsonbytype.param.messageIdentifier.description=Expected MX message identifier (e.g., "pacs.008.001.09", "camt.053.001.08")

# getmxmessageidentifier function
function.getmxmessageidentifier.description=Extracts the message identifier from a SWIFT MX message. Useful for determining the type of an MX message before processing.
function.getmxmessageidentifier.param.mxMessage.description=The raw SWIFT MX message string (XML format) to analyze

