# SWIFT MX Converter Functions Internationalization
# This file defines display names and descriptions for SWIFT MX message conversion functions

# Function: swiftmxtojson
function.swiftmxtojson=Convert SWIFT MX to JSON
function.swiftmxtojson.description=Converts a SWIFT MX (ISO 20022 XML) message to JSON format with structured field labels
function.swiftmxtojson.param.mxMessage=SWIFT MX Message
function.swiftmxtojson.param.mxMessage.description=The raw SWIFT MX message string (XML format) to convert

# Function: swiftmxtojsonbytype
function.swiftmxtojsonbytype=Convert SWIFT MX to JSON by Type
function.swiftmxtojsonbytype.description=Converts a SWIFT MX message to JSON format with message identifier validation
function.swiftmxtojsonbytype.param.mxMessage=SWIFT MX Message
function.swiftmxtojsonbytype.param.mxMessage.description=The raw SWIFT MX message string (XML format) to convert
function.swiftmxtojsonbytype.param.messageIdentifier=Message Identifier
function.swiftmxtojsonbytype.param.messageIdentifier.description=The expected MX message identifier (e.g., "pacs.008.001.09", "camt.053.001.08")

# Function: getmxmessageidentifier
function.getmxmessageidentifier=Get MX Message Identifier
function.getmxmessageidentifier.description=Extracts the message identifier from a SWIFT MX message for type determination
function.getmxmessageidentifier.param.mxMessage=SWIFT MX Message
function.getmxmessageidentifier.param.mxMessage.description=The raw SWIFT MX message string (XML format) to analyze

