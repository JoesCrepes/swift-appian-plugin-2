# SWIFT MT Converter Functions Internationalization
# This file defines display names and descriptions for SWIFT message conversion functions

# Function: swiftmttojson
function.swiftmttojson=Convert SWIFT MT to JSON
function.swiftmttojson.description=Converts a SWIFT MT message to JSON format with structured field labels
function.swiftmttojson.param.mtMessage=SWIFT MT Message
function.swiftmttojson.param.mtMessage.description=The raw SWIFT MT message string to convert
function.swiftmttojson.param.useStructuredFormat=Use Structured Format
function.swiftmttojson.param.useStructuredFormat.description=If true (default), uses structured JSON with business labels. If false, uses generic block format.

# Function: swiftmttojsonbytype
function.swiftmttojsonbytype=Convert SWIFT MT to JSON by Type
function.swiftmttojsonbytype.description=Converts a SWIFT MT message to JSON format with type validation
function.swiftmttojsonbytype.param.mtMessage=SWIFT MT Message
function.swiftmttojsonbytype.param.mtMessage.description=The raw SWIFT MT message string to convert
function.swiftmttojsonbytype.param.messageType=Message Type
function.swiftmttojsonbytype.param.messageType.description=The expected MT message type (e.g., "103", "MT103", "202")

