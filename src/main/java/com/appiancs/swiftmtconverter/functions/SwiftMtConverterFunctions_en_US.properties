# swiftmttojson function
function.swiftmttojson.description=Converts a SWIFT MT message to JSON format. By default, uses structured JSON with business field labels.
function.swiftmttojson.param.mtMessage.description=The raw SWIFT MT message text to convert
function.swiftmttojson.param.useStructuredFormat.description=Optional. If true (default), uses structured JSON with business field labels. If false, uses generic block format.

# swiftmttojsonbytype function
function.swiftmttojsonbytype.description=Converts a specific SWIFT MT message type to JSON format with type validation. Ensures the message matches the expected type before conversion.
function.swiftmttojsonbytype.param.mtMessage.description=The raw SWIFT MT message text to convert
function.swiftmttojsonbytype.param.messageType.description=Expected MT message type (e.g., "103", "MT103", "202", "950")

# validateswiftmt function
function.validateswiftmt.description=Validates a SWIFT MT message and returns detailed validation results including message type, validity status, and any errors found.
function.validateswiftmt.param.mtMessage.description=The raw SWIFT MT message text to validate
